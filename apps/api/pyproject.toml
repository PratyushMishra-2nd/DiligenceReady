[project]
name = "diligence-api"
version = "0.1.0"
description = "Read-mostly API over the reconciliation engine's typed tables."
requires-python = ">=3.12"
dependencies = [
    "diligence-engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # The model is reached through Amazon Bedrock. There is no second
    # provider: the no-key path is the deterministic template, not another
    # vendor.
    "boto3>=1.35",
    # AWS's open-source agent SDK. "Ask the ledger" runs on it, over
    # read-only engine tools.
    "strands-agents>=1.0",
    "python-multipart>=0.0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diligence_api"]

[tool.uv.sources]
diligence-engine = { workspace = true }
