# Amplify Hosting build spec for the dashboard.
#
# Amplify's own Next.js detection works, but this file makes a few things
# explicit that are easy to get wrong and hard to diagnose afterwards.
#
# Environment variables required in the Amplify console (set BEFORE the first build):
#
#   NEXT_PUBLIC_API_BASE      = ""   (empty string — API calls go same-origin)
#   NEXT_PUBLIC_API_UPSTREAM  = http://<ec2-public-dns>:8080
#   NEXT_PUBLIC_SITE_URL      = https://<this-app's-own-host>
#
# NEXT_PUBLIC_SITE_URL is the origin this app is served from, and the only
# one of the three a browser never exercises — so it is the one that goes
# wrong quietly. It is what `metadataBase` resolves against, which means the
# canonical link, the Open Graph share image, sitemap.xml and robots.txt all
# carry it. Left unset it falls back to the Amplify host written into
# app/lib/site.ts, so a custom domain or a second Amplify app keeps
# advertising the first one's URL: link previews fetch an image from another
# origin and a crawler is handed someone else's canonical.
#
# How the proxy works:
#   The browser calls https://<amplify-url>/api/... (same origin, HTTPS, no
#   mixed-content issue). Next.js rewrites() forwards those /api/* requests
#   server-side to http://<ec2>:8080/api/... The browser never sees HTTP.
#
# NEXT_PUBLIC_API_BASE must be "" (empty), NOT the EC2 HTTP URL. Setting it
# to the EC2 URL would cause the browser to call HTTP directly, which modern
# browsers block from an HTTPS page (mixed content).
#
# NEXT_PUBLIC_API_UPSTREAM is used by next.config.mjs rewrites() at build
# time to configure where to proxy. It is also a NEXT_PUBLIC_* variable so
# it is baked into the build and visible in the build log below.
#
# appRoot: the monorepo has the Python engine beside the web app; without
# this, Amplify tries to build the repository root and fails on pyproject.toml.
version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - 'echo "API base (should be empty): \"${NEXT_PUBLIC_API_BASE}\""'
            - 'echo "API upstream: ${NEXT_PUBLIC_API_UPSTREAM}"'
            - 'echo "Site URL: ${NEXT_PUBLIC_SITE_URL}"'
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
