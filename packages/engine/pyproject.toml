[project]
name = "diligence-engine"
version = "0.1.0"
description = "Deterministic reconciliation engine. Code decides; the model never produces a number."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "rapidfuzz>=3.10",
    "python-dotenv>=1.0",
    "click>=8.1",
    # S3 is the deployed object store; the local-disk backend is the dev path.
    "boto3>=1.35",
    # Cedar is AWS's open-source authorization language. The firm boundary is
    # expressed as policy in authz/*.cedar rather than as scattered Python.
    "cedarpy>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diligence_engine"]

[project.scripts]
diligence = "diligence_engine.cli:cli"
