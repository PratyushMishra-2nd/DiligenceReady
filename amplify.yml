version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - 'echo "API base (should be empty): \"${NEXT_PUBLIC_API_BASE}\""'
            - 'echo "API upstream: ${NEXT_PUBLIC_API_UPSTREAM}"'
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
