services:
  postgres:
    image: postgres:17-alpine
    container_name: diligence-pg
    environment:
      POSTGRES_USER: diligence
      POSTGRES_PASSWORD: diligence
      POSTGRES_DB: diligence
    ports:
      - "5544:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diligence -d diligence"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
