AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  DiligenceReady application: the API on a single EC2 instance (HTTP on port 8080),
  plus the nightly reconciliation as Lambda stages under Step Functions.

  No CloudFront, no App Runner — both require account verification on new accounts.
  The frontend (Amplify) uses Next.js rewrites to proxy /api/* to this EC2 instance
  server-side, so the browser never makes a direct HTTP call (no mixed-content issue).

  Same Docker image for both EC2 and Lambda — the nightly run and the dashboard
  cannot disagree about a rounding rule because they are the same bytes.

Parameters:
  ProjectName:
    Type: String
    Default: diligenceready

  ImageTag:
    Type: String
    Default: latest

  BedrockModelId:
    Type: String
    Default: ""

  BedrockRegion:
    Type: String
    Default: ""

  CorsOrigins:
    Type: String
    Default: ""

  InstanceType:
    Type: String
    Default: m7i-flex.large
    Description: >-
      Eight GiB, because this instance now serves the model as well as the
      API and a quantised 3B model needs about two of them resident. The
      obvious answer was four vCPUs (c6i.xlarge), and this account cannot
      launch one: an account on the AWS Free Tier plan is refused any
      instance type that is not free-tier eligible, with "The specified
      instance type is not eligible for Free Tier" at CreateInstance. Of the
      eight types it will launch, m7i-flex.large is the only one with the
      memory, so the shape of this deployment is set by an account plan
      rather than by the workload. It is also not burstable in the t3 sense,
      which matters: sustained inference on a t3 spends CPU credits until
      the balance is gone and then runs at a fraction of a core.

  RootVolumeSizeGb:
    Type: Number
    Default: 30
    Description: >-
      The default 8 GiB does not hold Amazon Linux, Docker, the application
      image and a quantised model at the same time. 30 is the ceiling the
      free tier covers, and it fits all four with room to spare.

  LlmProvider:
    Type: String
    Default: auto
    AllowedValues: ["auto", "bedrock", "ollama", "none"]
    Description: >-
      auto tries Bedrock first and the local model second. Pin it to ollama
      to skip the Bedrock attempt while the account hold is in force, or to
      none to run the deterministic templates alone.

  LocalModelId:
    Type: String
    Default: qwen2.5:3b
    Description: >-
      The open-weights model this instance serves. Small enough to answer on
      CPU, and chosen for tool calling, which "Ask the ledger" needs.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: >-
      Resolved live against SSM so it is always a valid, current AMI for the
      deploy region.

  ScheduleExpression:
    Type: String
    Default: "cron(30 19 * * ? *)"

  ScheduleEnabled:
    Type: String
    Default: "ENABLED"
    AllowedValues: ["ENABLED", "DISABLED"]

Conditions:
  HasBedrockRegion: !Not [!Equals [!Ref BedrockRegion, ""]]

Resources:
  # ── how the application reaches Postgres ──────────────────────────────────

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: The API instance and the pipeline Lambdas.
      VpcId:
        Fn::ImportValue: !Sub "${ProjectName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
          Description: HTTP API port 8080 proxied by Next.js server
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Postgres in-VPC, S3 by gateway endpoint, Bedrock via NAT/IGW.
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-app"

  DatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ProjectName}-DbSecurityGroupId"
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref AppSecurityGroup
      Description: !Sub "${ProjectName} application"

  # ── what the application is allowed to do ─────────────────────────────────

  ApplicationPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: What the API and the pipeline may touch. Nothing else.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Documents
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:ListBucket
            Resource:
              - !Sub
                - "arn:aws:s3:::${Bucket}"
                - Bucket: !ImportValue
                    Fn::Sub: "${ProjectName}-DocumentBucketName"
              - !Sub
                - "arn:aws:s3:::${Bucket}/*"
                - Bucket: !ImportValue
                    Fn::Sub: "${ProjectName}-DocumentBucketName"
          - Sid: DatabaseCredentials
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              Fn::ImportValue: !Sub "${ProjectName}-DbSecretArn"
          - Sid: Explanations
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource:
              # The wildcard region is not laziness. A cross-region
              # inference profile runs the call in whichever region has
              # capacity, and the authorisation is evaluated against the
              # foundation model in *that* region, not this one.
              - "arn:aws:bedrock:*::foundation-model/*"
              - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
          - Sid: ModelCatalogue
            Effect: Allow
            Action:
              # Read-only listings of what this account can call. The
              # application uses them to pick a live model at start-up
              # instead of trusting an id that was chosen at deploy time and
              # has since been retired. Neither call reads a model, a prompt
              # or a byte of client data, and neither takes a resource.
              - bedrock:ListFoundationModels
              - bedrock:ListInferenceProfiles
            Resource: "*"

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref ApplicationPolicy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  PipelineLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - !Ref ApplicationPolicy

  # ── the API: one EC2 instance running the container ───────────────────────
  #
  # The instance is in a PUBLIC subnet so it gets a public IP. Port 8080
  # accepts connections on that IP. The Amplify Next.js server (running
  # server-side) talks HTTP to port 8080; the browser always talks HTTPS to
  # Amplify. No CDN layer is needed.

  ApiInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions:
        HttpEndpoint: enabled
        HttpPutResponseHopLimit: 2
      SubnetId:
        Fn::Select:
          - 0
          - !Split [",", Fn::ImportValue: !Sub "${ProjectName}-PublicSubnetIds"]
      SecurityGroupIds:
        - !Ref AppSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref RootVolumeSizeGb
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-api"
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -euo pipefail
            dnf install -y docker
            systemctl enable --now docker
            # -- the model server ----------------------------------------
            #
            # This is here because Amazon Bedrock will not answer for this
            # account. A new AWS account cannot invoke any foundation model
            # until a billing cycle closes; until then every id in the
            # catalogue returns `ValidationException: Operation not allowed`.
            # The alternative was a free hosted API, which would have moved
            # the only inference in an AWS project off AWS. This keeps it on
            # the same instance, in the same VPC, billed as EC2 hours the
            # account's credits already cover.
            #
            # Loopback only. The model server has no authentication of its
            # own; the API container runs with --net=host and reaches it at
            # 127.0.0.1, and nothing outside this instance has any business
            # talking to it. The security group would allow it. The bind
            # address does not.
            curl -fsSL https://ollama.com/install.sh | sh
            mkdir -p /etc/systemd/system/ollama.service.d
            cat > /etc/systemd/system/ollama.service.d/override.conf <<'UNIT'
            [Service]
            Environment="OLLAMA_HOST=127.0.0.1:11434"
            # Keep the weights resident. Reloading two gigabytes from disk
            # between tool calls turns one agent question into minutes, and
            # the agent loop makes several calls per question by design.
            Environment="OLLAMA_KEEP_ALIVE=30m"
            Environment="OLLAMA_MAX_LOADED_MODELS=1"
            Environment="OLLAMA_NUM_PARALLEL=1"
            UNIT
            systemctl daemon-reload
            systemctl enable --now ollama
            # The pull is slow and the API must not wait for it: a request
            # that arrives first gets the deterministic sentence and says
            # so, which is what the product already does when no model is
            # reachable.
            #
            # It runs as its own unit rather than as a backgrounded subshell
            # for two reasons, both learned the hard way on this instance. A
            # child of the boot script is killed when the boot script exits,
            # so the first version of this line left an instance with a
            # model server and no model. And `ollama pull` reads HOME to
            # find its model directory, which cloud-init does not set — it
            # panics with "$HOME is not defined" and exits 2, which as a
            # backgrounded subshell is a failure nobody sees.
            cat > /etc/systemd/system/ollama-pull.service <<'PULL'
            [Unit]
            Description=Pull the local model
            After=ollama.service network-online.target
            Wants=ollama.service network-online.target

            [Service]
            Type=oneshot
            RemainAfterExit=yes
            Environment=HOME=/root
            Environment=OLLAMA_HOST=127.0.0.1:11434
            ExecStartPre=/bin/bash -c 'until curl -sf http://127.0.0.1:11434/api/version >/dev/null; do sleep 2; done'
            ExecStart=/usr/local/bin/ollama pull ${LocalModelId}
            # A pull that fails on a flaky network should be retried, not
            # mourned. The unit is idempotent: a model already on disk
            # returns immediately.
            Restart=on-failure
            RestartSec=30

            [Install]
            WantedBy=multi-user.target
            PULL
            systemctl daemon-reload
            systemctl enable --now ollama-pull.service

            # -- the API -------------------------------------------------

            aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin ${RepoHost}
            docker pull ${RepoUri}:${ImageTag}
            docker run -d --name api --restart always --net=host \
              -e AWS_REGION=${AWS::Region} \
              -e AWS_DEFAULT_REGION=${AWS::Region} \
              -e STORAGE_BACKEND=s3 \
              -e S3_BUCKET=${DocBucket} \
              -e S3_PREFIX=documents \
              -e DB_HOST=${DbHost} \
              -e DB_PORT=${DbPort} \
              -e DB_NAME=diligence \
              -e DB_USER=diligence \
              -e DB_SECRET_ARN=${DbSecretArn} \
              -e BEDROCK_MODEL_ID=${BedrockModelId} \
              -e BEDROCK_REGION=${EffectiveBedrockRegion} \
              -e LLM_PROVIDER=${LlmProvider} \
              -e OLLAMA_HOST=http://127.0.0.1:11434 \
              -e OLLAMA_MODEL=${LocalModelId} \
              -e CORS_ORIGINS=${CorsOrigins}               -e SESSION_COOKIE_SECURE=true \
              -e PORT=8080 \
              ${RepoUri}:${ImageTag}
          - RepoHost: !Select
              - 0
              - !Split
                - "/"
                - Fn::ImportValue: !Sub "${ProjectName}-ImageRepositoryUri"
            RepoUri: !ImportValue
              Fn::Sub: "${ProjectName}-ImageRepositoryUri"
            DocBucket: !ImportValue
              Fn::Sub: "${ProjectName}-DocumentBucketName"
            DbHost: !ImportValue
              Fn::Sub: "${ProjectName}-DbEndpoint"
            DbPort: !ImportValue
              Fn::Sub: "${ProjectName}-DbPort"
            DbSecretArn: !ImportValue
              Fn::Sub: "${ProjectName}-DbSecretArn"
            EffectiveBedrockRegion: !If [HasBedrockRegion, !Ref BedrockRegion, !Ref "AWS::Region"]

  # The instance's address, held by the account rather than by the instance.
  #
  # Amplify's rewrite proxy is configured with this address as its upstream,
  # in an environment variable that only takes effect on a rebuild. An
  # auto-assigned public IP changes every time the instance is replaced —
  # and changing the instance type or the boot script replaces it — so
  # without this, every change to the API host is also a frontend rebuild,
  # with a window in between where the dashboard is talking to an address
  # that no longer exists.
  ApiAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref ApiInstance
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-api"

  # ── the nightly reconciliation ─────────────────────────────────────────────

  PipelineFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-pipeline"
      PackageType: Image
      Code:
        ImageUri: !Sub
          - "${Repo}:${ImageTag}"
          - Repo: !ImportValue
              Fn::Sub: "${ProjectName}-ImageRepositoryUri"
      ImageConfig:
        EntryPoint: ["/app/.venv/bin/python", "-m", "awslambdaric"]
        Command: ["diligence_engine.aws_lambda.handler"]
        WorkingDirectory: /app
      Role: !GetAtt PipelineLambdaRole.Arn
      Timeout: 900
      MemorySize: 2048
      Environment:
        Variables:
          STORAGE_BACKEND: s3
          S3_BUCKET:
            Fn::ImportValue: !Sub "${ProjectName}-DocumentBucketName"
          S3_PREFIX: documents
          DB_HOST:
            Fn::ImportValue: !Sub "${ProjectName}-DbEndpoint"
          DB_PORT:
            Fn::ImportValue: !Sub "${ProjectName}-DbPort"
          DB_NAME: diligence
          DB_USER: diligence
          DB_SECRET_ARN:
            Fn::ImportValue: !Sub "${ProjectName}-DbSecretArn"
      VpcConfig:
        SubnetIds: !Split
          - ","
          - Fn::ImportValue: !Sub "${ProjectName}-PrivateSubnetIds"
        SecurityGroupIds:
          - !Ref AppSecurityGroup

  PipelineLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-pipeline"
      RetentionInDays: 14

  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/vendedlogs/states/${ProjectName}-pipeline"
      RetentionInDays: 14

  StateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-and-log
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt PipelineFunction.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"

  PipelineStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${ProjectName}-pipeline"
      RoleArn: !GetAtt StateMachineRole.Arn
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
      DefinitionString: !Sub |
        {
          "Comment": "Nightly reconciliation.",
          "StartAt": "Migrate",
          "States": {
            "Migrate": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${PipelineFunction.Arn}",
                "Payload": { "stage": "migrate" }
              },
              "ResultSelector": { "migrate.$": "$.Payload" },
              "ResultPath": "$.migrate",
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"],
                  "IntervalSeconds": 5,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Next": "Reconcile"
            },
            "Reconcile": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${PipelineFunction.Arn}",
                "Payload": { "stage": "reconcile" }
              },
              "ResultSelector": { "reconcile.$": "$.Payload" },
              "ResultPath": "$.reconcile",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 10,
                  "MaxAttempts": 2,
                  "BackoffRate": 2
                }
              ],
              "Next": "Ims"
            },
            "Ims": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${PipelineFunction.Arn}",
                "Payload": { "stage": "ims" }
              },
              "ResultSelector": { "ims.$": "$.Payload" },
              "ResultPath": "$.ims",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 10,
                  "MaxAttempts": 2,
                  "BackoffRate": 2
                }
              ],
              "Next": "Rules"
            },
            "Rules": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${PipelineFunction.Arn}",
                "Payload": { "stage": "rules" }
              },
              "ResultSelector": { "rules.$": "$.Payload" },
              "ResultPath": "$.rules",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 10,
                  "MaxAttempts": 2,
                  "BackoffRate": 2
                }
              ],
              "End": true
            }
          }
        }

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref "AWS::AccountId"
      Policies:
        - PolicyName: start-the-pipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref PipelineStateMachine

  NightlySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-nightly"
      State: !Ref ScheduleEnabled
      FlexibleTimeWindow:
        Mode: FLEXIBLE
        MaximumWindowInMinutes: 15
      ScheduleExpression: !Ref ScheduleExpression
      ScheduleExpressionTimezone: Asia/Kolkata
      Target:
        Arn: !Ref PipelineStateMachine
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: "{}"
        RetryPolicy:
          MaximumRetryAttempts: 2

Outputs:
  ApiUrl:
    Description: >-
      The API's HTTP endpoint on the EC2 instance. Used by the Next.js server
      as the upstream for its /api/* rewrite proxy. NOT called by the browser
      directly — browsers call the Amplify HTTPS URL which proxies here.
    Value: !Sub "http://${ApiAddress}:8080"

  ApiPublicIp:
    Description: >-
      The API's Elastic IP. Stable across instance replacement, which is what
      lets the Amplify upstream be set once.
    Value: !Ref ApiAddress

  HealthUrl:
    Value: !Sub "http://${ApiAddress}:8080/api/health"

  StateMachineArn:
    Value: !Ref PipelineStateMachine

  PipelineFunctionName:
    Value: !Ref PipelineFunction
